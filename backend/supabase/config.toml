project_id = "cluttersheild-pakistan-local"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
enable_signup = true

[functions.submit-report]
verify_jwt = false

[functions.get-own-report]
verify_jwt = true

[functions.moderator-review]
verify_jwt = true

[functions.analyst-cases]
verify_jwt = true

[functions.assign-case]
verify_jwt = true

[functions.submit-finding]
verify_jwt = true

[functions.approve-indicator]
verify_jwt = true

[functions.create-dossier]
verify_jwt = true

[functions.approve-disclosure]
verify_jwt = true

[functions.challenge-indicator]
verify_jwt = false

[functions.create-feed-release]
verify_jwt = true

[functions.report-abuse]
verify_jwt = false

[functions.upload-evidence]
verify_jwt = false

[functions.feed-snapshot]
verify_jwt = false

[functions.compile-feed]
verify_jwt = true

[functions.team-chat]
verify_jwt = true

